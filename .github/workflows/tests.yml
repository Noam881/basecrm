name: Independent base CRM
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, mbstring, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: composer install --no-interaction
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --debug --no-progress
# PostgreSQL/browser/upgrade commands are documented in README and verified locally.
# When extracting this directory to its own repository, extend this workflow with isolated CI credentials and PostgreSQL 18 services.
