name: Base CRM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: base_test
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-ephemeral
      MAIL_MAILER: array
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: base_test
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, mbstring, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --debug --no-progress --memory-limit=512M
      - run: php artisan test --compact
