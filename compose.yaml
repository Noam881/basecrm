name: awove-base-crm
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure-local.py first}
    ports: ['127.0.0.1:55438:5432']
    volumes: ['pg18:/var/lib/postgresql','./docker/init-databases.sh:/docker-entrypoint-initdb.d/init.sh:ro']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U bootstrap']
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:8028:8025','127.0.0.1:1028:1025']
  alpha: &app
    build: .
    profiles: ['full']
    env_file: .env.alpha
    environment: &runtime
      DB_HOST: postgres
      DB_PORT: 5432
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports: ['127.0.0.1:8091:8080']
    volumes: ['alpha_storage:/app/storage']
    depends_on:
      postgres: {condition: service_healthy}
  beta:
    <<: *app
    env_file: .env.beta
    ports: ['127.0.0.1:8092:8080']
    volumes: ['beta_storage:/app/storage']
  alpha-worker:
    <<: *app
    healthcheck: {disable: true}
    ports: []
    command: ['php','artisan','queue:work','--tries=3','--sleep=1','--timeout=60']
  beta-worker:
    <<: *app
    healthcheck: {disable: true}
    env_file: .env.beta
    ports: []
    volumes: ['beta_storage:/app/storage']
    command: ['php','artisan','queue:work','--tries=3','--sleep=1','--timeout=60']
  alpha-scheduler:
    <<: *app
    healthcheck: {disable: true}
    ports: []
    command: ['php','artisan','schedule:work']
  beta-scheduler:
    <<: *app
    healthcheck: {disable: true}
    env_file: .env.beta
    ports: []
    volumes: ['beta_storage:/app/storage']
    command: ['php','artisan','schedule:work']
volumes:
  pg18:
  alpha_storage:
  beta_storage:
